<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPORVA — فرصتك في وقتها</title>
<style>
body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #0A0A0F 0%, #1A1A2E 50%, #0A0A0F 100%); color: #F0F4FF; min-height: 100vh; margin: 0; text-align: center; }
.header { padding: 80px 20px; }
.logo { font-size: 48px; font-weight: 900; background: linear-gradient(90deg, #D4AF37, #6C2BD9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.tagline { font-size: 20px; color: #C0C0C0; margin: 20px 0 40px; }
.cta-button { padding: 18px 48px; background: linear-gradient(90deg, #D4AF37, #6C2BD9); color: #0A0A0F; font-weight: 700; font-size: 18px; border-radius: 50px; border: none; cursor: pointer; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
.feature-card { background: rgba(26, 26, 46, 0.8); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 20px; padding: 40px; }
.feature-title { font-size: 24px; font-weight: 700; color: #D4AF37; margin: 15px 0; }
</style>
</head>
<body>
<div class="header">
<div class="logo">⚡ OPORVA</div>
<p class="tagline">فرصتك الذهبية.. في وقتها المثالي</p>
<button class="cta-button">ابدأ رحلتك الآن</button>
</div>
<div class="features">
<div class="feature-card"><div style="font-size:48px">🎯</div><div class="feature-title">الفرصة المتاحة</div><p>نرصد لك الفرص المتاحة بدقة</p></div>
<div class="feature-card"><div style="font-size:48px">⏳</div><div class="feature-title">وقتك ذهب</div><p>نوفر عليك شهوراً من البحث</p></div>
<div class="feature-card"><div style="font-size:48px">🏆</div><div class="feature-title">كن المخضرم</div><p>خبرة سنوات في دقائق</p></div>
<div class="feature-card"><div style="font-size:48px">💎</div><div class="feature-title">تستحق الأفضل</div><p>خدمة مخصصة من البداية للنهاية</p></div>
</div>
<div style="text-align:center; padding: 40px; color: #6B7280;">© 2026 OPORVA</div>
</body>
</html>
